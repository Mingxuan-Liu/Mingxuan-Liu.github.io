<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 112" role="img" aria-label="Vanilla, a black-and-white husky with brown eyes">
  <title>Vanilla</title>
  <g class="vn-dog">
    <defs>
      <linearGradient id="vn-blaze" gradientUnits="userSpaceOnUse" x1="60" y1="43" x2="60" y2="67">
        <stop offset="0" stop-color="#282925"/>
        <stop offset=".28" stop-color="#282925" stop-opacity=".95"/>
        <stop offset=".58" stop-color="#484A41" stop-opacity=".55"/>
        <stop offset=".84" stop-color="#646558" stop-opacity=".2"/>
        <stop offset="1" stop-color="#646558" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="vn-muzzle-warmth">
        <stop offset="0" stop-color="#D9B879" stop-opacity=".55"/>
        <stop offset=".5" stop-color="#E5CC9C" stop-opacity=".32"/>
        <stop offset="1" stop-color="#FAF9F2" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- Separate ears retain their hover animation and pivot at the skull. -->
    <g class="vn-ear vn-ear-l">
      <path d="M20 46C16 35 17 13 22 5c3-5 7-1 12 5l17 22Z" fill="#282925" stroke="#151714" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M22 37c-1-10 0-23 3-27 2-2 10 9 17 20Z" fill="#FAF9F2"/>
      <path d="M26 33c-1-7-1-14 1-17 3 2 7 8 10 14Z" fill="#C8B8AE"/>
      <path d="m23 37 2-7 3 3 1-5 5 4-1 6Z" fill="#E8E5DC"/>
    </g>
    <g class="vn-ear vn-ear-r">
      <path d="M100 46c4-11 3-33-2-41-3-5-7-1-12 5L69 32Z" fill="#282925" stroke="#151714" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M98 37c1-10 0-23-3-27-2-2-10 9-17 20Z" fill="#FAF9F2"/>
      <path d="M94 33c1-7 1-14-1-17-3 2-7 8-10 14Z" fill="#C8B8AE"/>
      <path d="m97 37-2-7-3 3-1-5-5 4 1 6Z" fill="#E8E5DC"/>
    </g>

    <!-- A taller, rounded forehead and a fluffy head-only silhouette. -->
    <path d="M19 44C24 30 35 20 47 17Q60 13 73 17C85 20 96 30 101 44l6 13-5-2 7 21-5-3 2 9-6-3c-2 9-8 16-17 20l-1-4c-6 6-13 10-22 12-9-2-16-6-22-12l-1 4c-9-4-15-11-17-20l-6 3 2-9-5 3 7-21-5 2Z" fill="#282925" stroke="#151714" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M21 59c-2 6-3 12-3 17l5-4c0 7 3 13 7 17l-1-8c5 9 14 16 22 19l9 5 9-5c8-3 17-10 22-19l-1 8c4-4 7-10 7-17l5 4c0-5-1-11-3-17-7-9-17-12-25-6-5-3-9-4-14-4s-9 1-14 4c-8-6-18-3-25 6Z" fill="#FAF9F2"/>

    <g class="vn-muzzle" transform="translate(10.8 0) scale(.82 1)">
      <!-- Slender white muzzle and an open, smiling mouth, without a collar. -->
      <path d="M37 81c5 11 13 18 23 19 10-1 18-8 23-19-7 6-15 8-23 8s-16-2-23-8Z" fill="#DDDCD3"/>
      <path class="vn-mouth" d="M35 73c6 11 13 11 25 7 12 4 19 4 25-7-4 10-10 23-25 23S39 83 35 73Z" fill="#10130F" stroke="#10130F" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M50 88q10 5 20 0c0 6-20 6-20 0Z" fill="#FAF9F2"/>
      <g class="vn-tongue">
        <path d="M49 84c3-3 7-3 11-1 4-2 8-2 11 1l-2 6c-3 6-15 6-18 0Z" fill="#CD8D89"/>
        <path d="M60 84v5" fill="none" stroke="#AC6D70" stroke-width=".9" stroke-linecap="round"/>
      </g>
      <path d="M39 65c5-7 13-8 21-5 8-3 16-2 21 5 4 4 3 10-1 13-6 5-12 4-20 0-8 4-14 5-20 0-4-3-5-9-1-13Z" fill="#FAF9F2"/>
      <!-- Cream-gold shading beside her nose. -->
      <ellipse cx="46" cy="65" rx="12" ry="14" fill="url(#vn-muzzle-warmth)"/>
      <ellipse cx="74" cy="65" rx="12" ry="14" fill="url(#vn-muzzle-warmth)"/>
    </g>
    <path d="M50 40c6 5-1 10 4 18l4 7q2 4 4 0l4-7c5-8-2-13 4-18Z" fill="url(#vn-blaze)"/>
    <!-- Vanilla's white brows frame a narrow dark blaze between her eyes. -->
    <path d="M34 50c-3 0-3-2-1-5 2-3 5-5 8-6-2-4 1-7 5-7 5 0 10 4 10 10 0 5-3 10-6 13l-3-3-10 1-6 4Z" fill="#FAF9F2"/>
    <path d="M86 50c3 0 3-2 1-5-2-3-5-5-8-6 2-4-1-7-5-7-5 0-10 4-10 10 0 5 3 10 6 13l3-3 10 1 6 4Z" fill="#FAF9F2"/>

    <g class="vn-eyes">
      <g class="vn-eyes-open">
        <path d="M31 49c3-5 7-7 11-6 5 0 8 4 10 8-7 5-15 4-21-2Z" fill="#151714"/>
        <path d="M89 49c-3-5-7-7-11-6-5 0-8 4-10 8 7 5 15 4 21-2Z" fill="#151714"/>
        <ellipse cx="41.5" cy="48.8" rx="6.4" ry="6.1" fill="#80502D"/>
        <ellipse cx="78.5" cy="48.8" rx="6.4" ry="6.1" fill="#80502D"/>
        <path d="M36.8 50.1q4.4 5.6 9.4-.3M73.8 50.1q4.4 5.6 9.4-.3" fill="none" stroke="#AE7B46" stroke-width="1.6" stroke-linecap="round"/>
        <ellipse cx="42" cy="48.5" rx="3.6" ry="4.6" fill="#111411"/>
        <ellipse cx="78" cy="48.5" rx="3.6" ry="4.6" fill="#111411"/>
        <circle cx="43.7" cy="46.2" r="1.65" fill="#FFFFFF"/>
        <circle cx="79.7" cy="46.2" r="1.65" fill="#FFFFFF"/>
      </g>
      <g class="vn-eyes-happy" opacity="0" fill="none" stroke="#151714" stroke-width="2.7" stroke-linecap="round">
        <path d="M33 50q8.5-9 17 0"/>
        <path d="M70 50q8.5-9 17 0"/>
      </g>
    </g>

    <g class="vn-nose" transform="translate(10.8 0) scale(.82 1)">
      <path d="M55 70c0 3-2 6-2 10l7-2 7 2c0-4-2-7-2-10Z" fill="#CFD0C7"/>
      <path d="M60 62c7 0 11 3 10 8-1 5-6 8-10 9-4-1-9-4-10-9-1-5 3-8 10-8Z" fill="#282B26" stroke="#111410" stroke-width="1.5"/>
      <ellipse cx="60" cy="65" rx="5.7" ry="1.45" fill="#656960"/>
      <path d="M51 69c4-3 6 2 4 3-2 1-3 0-4-1m18-2c-4-3-6 2-4 3 2 1 3 0 4-1" fill="#10130F"/>
      <path d="M60 79v1m-25-7c6 11 14 12 25 7 11 5 19 4 25-7" fill="none" stroke="#10130F" stroke-width="1.5" stroke-linecap="round"/>
      <path d="m34 74 1-2m51 2-1-2" fill="none" stroke="#10130F" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>
</svg>
